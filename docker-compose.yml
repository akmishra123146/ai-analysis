version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crm_postgres
    restart: always
    environment:
      POSTGRES_DB: crm_ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: crm_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_ai_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:crm_secure_password@postgres:5432/crm_ai_db
      JWT_SECRET: crm_ai_analytics_super_secret_jwt_key_2026
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
      NVIDIA_MODEL: meta/llama-3.1-70b-instruct
    depends_on:
      - postgres

volumes:
  pgdata:
